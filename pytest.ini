[pytest]
asyncio_mode = auto
# Deliberately NOT setting asyncio_default_fixture_loop_scope: leaving it at
# the default (function scope) keeps fixtures on the same event loop as the
# test function that uses them. Setting it to "session" here caused a real
# bug - an asyncpg connection opened in one test's loop was torn down by a
# different test's loop during rollback, raising "attached to a different
# loop" / "Event loop is closed". Function scope costs a fresh connection
# per test, which is the right trade for correctness over a small speedup.
